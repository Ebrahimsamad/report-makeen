<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>التقارير الشهرية — THC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <!-- PDF Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
      /* ═══════════════════════════════════════
   THEME VARIABLES
═══════════════════════════════════════ */
      :root {
        --sidebar-bg: #f8f7f3;
        --sidebar-w: 228px;
        --topbar-bg: #ffffff;
        --bg: #f5f3ef;
        --card: #ffffff;
        --surface: #faf8f5;
        --line: #ede8e0;
        --line2: #ddd6cc;
        --ink: #0f0e0c;
        --ink2: #4a4641;
        --ink3: #8b8680;
        --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.04);
        --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.08);
        --shadow-md: 0 8px 20px rgba(0, 0, 0, 0.12);
        --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.15);
        --green: #1b6e3f;
        --green-dk: #134d2c;
        --green-bg: #e6f5ee;
        --amber: #d97706;
        --amber-bg: #fffbf0;
        --red: #dc2626;
        --red-bg: #fef2f2;
        --blue: #0066cc;
        --blue-bg: #eff6ff;
        --gray-bg: #f3f0eb;
      }
      [data-theme="dark"] {
        --sidebar-bg: #1a1815;
        --topbar-bg: #1f1c18;
        --bg: #15120f;
        --card: #1f1c18;
        --surface: #2a2520;
        --line: #3a342a;
        --line2: #4a4238;
        --ink: #f5f0e8;
        --ink2: #b8afa0;
        --ink3: #7a7168;
        --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.3);
        --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.35);
        --shadow-md: 0 8px 20px rgba(0, 0, 0, 0.4);
        --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.5);
        --green: #4caf50;
        --green-dk: #388e3c;
        --green-bg: #1b4620;
        --amber: #f59e0b;
        --amber-bg: #2a2010;
        --red: #f87171;
        --red-bg: #2a1410;
        --blue: #60a5fa;
        --blue-bg: #0d1e30;
        --gray-bg: #2a2520;
      }
    </style>
  </head>
  <body></body>
</html>
<style>
  /* ═══════════════════════════════════════ BASE ═══════════════════════════════════════ */
  *,
  *::before,
  *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  html,
  body {
    height: 100%;
  }
  body {
    font-family: "Cairo", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 13px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    transition: background 0.3s ease, color 0.3s ease;
  }
  ::-webkit-scrollbar {
    width: 5px;
    height: 5px;
  }
  ::-webkit-scrollbar-track {
    background: transparent;
  }
  ::-webkit-scrollbar-thumb {
    background: var(--line2);
    border-radius: 99px;
  }

  /* ═══════════════════════════════════════ LAYOUT ═══════════════════════════════════════ */
  .app {
    display: flex;
    height: 100vh;
    overflow: hidden;
  }
  .sidebar {
    width: var(--sidebar-w);
    flex-shrink: 0;
    background: var(--sidebar-bg);
    border-inline-start: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    overflow-x: hidden;
    transition: background 0.25s;
    order: 1;
  }
  .main {
    order: 2;
    flex: 1;
    min-width: 0;
  }
  .main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .body-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px 48px;
  }

  /* ═══════════════════════════════════════ SIDEBAR ═══════════════════════════════════════ */
  .s-logo {
    padding: 16px 18px 14px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .thc-logo {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 20px;
    font-weight: 900;
    color: #c0392b;
    letter-spacing: -0.5px;
    line-height: 1;
  }
  .thc-logo-sub {
    font-size: 9px;
    color: var(--ink3);
    font-weight: 500;
    margin-top: 1px;
    letter-spacing: 0.3px;
  }
  .s-section {
    padding: 14px 16px 5px;
    font-size: 9.5px;
    font-weight: 700;
    color: var(--ink3);
    letter-spacing: 1.2px;
    text-transform: uppercase;
  }
  .s-item {
    display: flex;
    align-items: center;
    flex-direction: row;
    gap: 9px;
    padding: 8px 14px;
    margin: 1px 7px;
    border-radius: 8px;
    color: var(--ink2);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
    text-decoration: none;
    border: none;
    background: none;
    width: calc(100% - 14px);
    font-family: inherit;
    justify-content: space-between;
  }
  .s-item svg {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    opacity: 0.65;
    transition: opacity 0.18s;
    stroke: currentColor;
  }
  .s-item:hover {
    background: rgba(45, 125, 79, 0.1);
    color: var(--green);
  }
  .s-item:hover svg {
    opacity: 1;
  }
  .s-item.active {
    background: var(--green-bg);
    color: var(--green);
    font-weight: 700;
  }
  .s-item.active svg {
    opacity: 1;
  }
  .s-sub {
    margin-right: 10px;
    padding-right: 8px;
    border-right: 2px solid var(--line);
  }
  .s-sub .s-item {
    font-size: 12.5px;
    padding: 7px 10px;
  }
  .s-sub .s-item.active {
    background: none;
    border-right: 2px solid var(--green);
    border-radius: 0;
    margin-right: -10px;
    padding-right: 8px;
  }
  .s-badge {
    margin-right: auto;
    background: var(--red);
    color: #fff;
    font-size: 9.5px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 99px;
    line-height: 1.4;
  }
  .s-foot {
    margin-top: auto;
    padding: 12px 16px;
    border-top: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 9px;
  }
  .s-name {
    font-size: 12px;
    font-weight: 700;
    color: var(--ink);
  }
  .s-role {
    font-size: 10px;
    color: var(--ink3);
  }
</style>
<style>
  /* ═══════════════════════════════════════ AVATAR ═══════════════════════════════════════ */
  .avatar-comp {
    position: relative;
    flex-shrink: 0;
  }
  .avatar-circle {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .avatar-circle svg {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
  }
  .avatar-online::after {
    content: "";
    position: absolute;
    bottom: 1px;
    left: 1px;
    width: 9px;
    height: 9px;
    background: #22c55e;
    border-radius: 50%;
    border: 2px solid var(--topbar-bg);
  }
  .s-avatar-wrap {
    display: flex;
    align-items: center;
    gap: 9px;
    flex: 1;
    min-width: 0;
  }

  /* ═══════════════════════════════════════ TOPBAR ═══════════════════════════════════════ */
  .topbar {
    background: var(--topbar-bg);
    border-bottom: 1px solid var(--line);
    padding: 10px 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    box-shadow: var(--shadow-xs);
    transition: background 0.25s;
  }
  .tb-left {
    display: flex;
    align-items: center;
    gap: 9px;
  }
  .tb-name {
    font-size: 13px;
    font-weight: 700;
    color: var(--ink);
  }
  .tb-role {
    font-size: 11px;
    color: var(--ink3);
  }
  .tb-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .tb-crumbs {
    font-size: 12px;
    color: var(--ink3);
  }
  .tb-crumbs b {
    color: var(--ink);
  }
  .icon-btn {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: var(--surface);
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--ink2);
    transition: all 0.18s;
    position: relative;
    flex-shrink: 0;
  }
  .icon-btn svg {
    width: 16px;
    height: 16px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
  }
  .icon-btn:hover {
    border-color: var(--green);
    color: var(--green);
  }
  .icon-btn .notif-dot {
    position: absolute;
    top: -3px;
    left: -3px;
    width: 15px;
    height: 15px;
    background: var(--red);
    border-radius: 50%;
    color: #fff;
    font-size: 8px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid var(--topbar-bg);
  }

  /* ═══════════════════════════════════════ PAGE HEADER ═══════════════════════════════════════ */
  .page-header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .page-title {
    font-size: 32px;
    font-weight: 900;
    color: var(--ink);
    letter-spacing: -0.6px;
    line-height: 1.1;
  }
  .page-sub {
    font-size: 12.5px;
    color: var(--ink3);
    margin-top: 4px;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .page-sub svg {
    stroke: currentColor;
    fill: none;
    flex-shrink: 0;
  }
  .ph-actions {
    display: flex;
    gap: 8px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 9px 18px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    border: none;
    transition: all 0.25s ease;
    font-family: inherit;
    text-decoration: none;
  }
  .btn svg {
    width: 14px;
    height: 14px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2.5;
    flex-shrink: 0;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--green) 0%, var(--green-dk) 100%);
    color: #fff;
    box-shadow: 0 4px 12px rgba(27, 110, 63, 0.25);
  }
  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(27, 110, 63, 0.3);
  }
  .btn-outline {
    background: var(--card);
    color: var(--ink2);
    border: 1.5px solid var(--line);
  }
  .btn-outline:hover {
    border-color: var(--green);
    color: var(--green);
    background: var(--green-bg);
  }
</style>
<style>
  /* ═══════════════════════════════════════ STAT ROW ═══════════════════════════════════════ */
  .stat-row {
    display: grid;
    grid-template-columns: 150px repeat(3, 1fr) 1.5fr;
    gap: 16px;
    margin-bottom: 22px;
  }
  .sc {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px 18px;
    box-shadow: var(--shadow-sm);
    transition: all 0.2s ease;
  }
  .sc:hover {
    box-shadow: var(--shadow-md);
    transform: translateY(-2px);
    border-color: var(--line2);
  }
  .sc-icon {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 8px;
  }
  .sc-icon svg {
    width: 18px;
    height: 18px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
  }
  .sc-lbl {
    font-size: 11.5px;
    color: var(--ink3);
    font-weight: 600;
    margin-bottom: 6px;
    letter-spacing: 0.3px;
    text-transform: uppercase;
  }
  .sc-val {
    font-size: 40px;
    font-weight: 900;
    color: var(--ink);
    line-height: 1;
    letter-spacing: -1.5px;
  }
  .sc-sub {
    font-size: 11.5px;
    color: var(--ink3);
    margin-top: 4px;
  }
  .sc-date .sc-lbl {
    font-size: 11px;
  }
  .sc-date .date-icon {
    margin-bottom: 5px;
    color: var(--ink3);
  }
  .sc-date .date-icon svg {
    width: 26px;
    height: 26px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.5;
  }
  .sc-date .date-big {
    font-size: 17px;
    font-weight: 800;
    color: var(--ink);
    margin-top: 2px;
  }
  .sc-date .date-time {
    font-size: 11px;
    color: var(--ink3);
    margin-top: 2px;
  }
  .sc-kpi {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .sc-kpi-left .sc-lbl {
    font-size: 11.5px;
    margin-bottom: 4px;
  }
  .sc-kpi-val {
    font-size: 42px;
    font-weight: 900;
    color: var(--green);
    letter-spacing: -1.5px;
    line-height: 1;
  }
  .sc-kpi-bar {
    height: 5px;
    background: var(--line);
    border-radius: 99px;
    overflow: hidden;
    width: 110px;
    margin-top: 8px;
  }
  .sc-kpi-fill {
    height: 100%;
    background: var(--green);
    border-radius: 99px;
  }
  .sc-kpi-arrow {
    color: var(--green);
    font-weight: 900;
    opacity: 0.8;
    flex-shrink: 0;
  }
  .sc-kpi-arrow svg {
    width: 28px;
    height: 28px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2.5;
  }

  /* ═══════════════════════════════════════ MIDDLE PANELS ═══════════════════════════════════════ */
  .mid-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 16px;
    margin-bottom: 22px;
  }
  .panel {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px;
    box-shadow: var(--shadow-sm);
    transition: all 0.2s ease;
  }
  .panel:hover {
    box-shadow: var(--shadow-md);
    border-color: var(--line2);
  }
  .ph {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .ph-title {
    font-size: 13.5px;
    font-weight: 700;
    color: var(--ink);
  }
  .ph-link {
    font-size: 11.5px;
    color: var(--green);
    font-weight: 600;
    cursor: pointer;
  }
  .donut-row {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .donut-legend {
    flex: 1;
    display: grid;
    gap: 7px;
  }
  .dl {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
  }
  .dl-sq {
    width: 9px;
    height: 9px;
    border-radius: 2px;
    flex-shrink: 0;
  }
  .dl-lbl {
    flex: 1;
    color: var(--ink2);
  }
  .dl-n {
    font-weight: 700;
    color: var(--ink);
    min-width: 18px;
  }
  .dl-p {
    font-size: 11px;
    color: var(--ink3);
    min-width: 38px;
  }
  .list-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 0;
    border-bottom: 1px solid var(--line);
  }
  .list-item:last-child {
    border: none;
    padding-bottom: 0;
  }
  .li-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .li-name {
    flex: 1;
    font-size: 12.5px;
    color: var(--ink);
    font-weight: 500;
  }
  .li-pct {
    font-size: 13px;
    font-weight: 700;
    min-width: 50px;
    text-align: left;
  }
  .li-tag {
    font-size: 10.5px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 99px;
    flex-shrink: 0;
  }
  .li-check {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--green-bg);
    color: var(--green);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .li-check svg {
    width: 11px;
    height: 11px;
    stroke: currentColor;
    fill: none;
    stroke-width: 3;
  }
</style>
<style>
  /* ═══════════════════════════════════════ TABLE SECTION ═══════════════════════════════════════ */
  .table-section {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: var(--shadow-sm);
  }
  .t-toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
    flex-wrap: wrap;
  }
  .t-toolbar-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--ink);
    flex-shrink: 0;
  }
  .t-search {
    position: relative;
    flex: 1;
    min-width: 180px;
    max-width: 260px;
  }
  .t-search input {
    width: 100%;
    padding: 8px 12px 8px 36px;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    font-size: 13px;
    font-family: inherit;
    background: var(--card);
    color: var(--ink);
    outline: none;
    transition: all 0.2s ease;
  }
  .t-search input:focus {
    border-color: var(--green);
    box-shadow: 0 0 0 3px var(--green-bg);
  }
  .t-si {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--ink3);
    pointer-events: none;
    display: flex;
    align-items: center;
  }
  .t-si svg {
    width: 14px;
    height: 14px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
  }
  .t-sel {
    padding: 8px 12px;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    font-size: 13px;
    font-family: inherit;
    background: var(--card);
    color: var(--ink);
    outline: none;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .t-sel:hover {
    border-color: var(--line2);
  }
  .t-sel:focus {
    border-color: var(--green);
    box-shadow: 0 0 0 3px var(--green-bg);
  }
  .t-export {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 7px 13px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 12.5px;
    font-family: inherit;
    background: var(--card);
    color: var(--ink2);
    cursor: pointer;
    font-weight: 600;
    transition: all 0.18s;
  }
  .t-export svg {
    width: 14px;
    height: 14px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
  }
  .t-export:hover {
    border-color: var(--green);
    color: var(--green);
    background: var(--green-bg);
    transform: translateY(-1px);
  }
  .ml-auto {
    margin-right: auto;
  }
  table {
    width: 100%;
    border-collapse: collapse;
  }
  thead th {
    text-align: right;
    padding: 12px 14px;
    font-size: 11px;
    font-weight: 700;
    color: var(--ink2);
    letter-spacing: 0.6px;
    text-transform: uppercase;
    background: var(--surface);
    border-bottom: 2px solid var(--line2);
    white-space: nowrap;
  }
  tbody tr {
    border-bottom: 1px solid var(--line);
    transition: all 0.18s ease;
    cursor: pointer;
  }
  tbody tr:hover {
    background: linear-gradient(90deg, rgba(27, 110, 63, 0.03) 0%, transparent 100%);
  }
  tbody tr:hover td {
    background: rgba(27, 110, 63, 0.02);
  }
  td {
    padding: 13px 14px;
    vertical-align: middle;
    background: var(--card);
    transition: background 0.15s;
  }
  .td-n {
    font-size: 12px;
    color: var(--ink3);

/* Escapes special HTML characters to prevent layout breakage */
function esc(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function exportProfessionalPDF() {
  const ov = document.createElement('div');
  ov.className = 'pdf-loading';
  ov.innerHTML = '<div class="pdf-spinner"></div><div class="pdf-loading-text">جارٍ إنشاء التقرير…</div>';
  document.body.appendChild(ov);
  setTimeout(() => _buildHTMLPDF(ov), 80);
}

  wrap.innerHTML = `<style>${CSS}</style>${allPagesHTML}`;
  document.body.appendChild(wrap);

  const pages = wrap.querySelectorAll('.page');
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation:'portrait', unit:'px', format:[794,1123], hotfixes:['px_scaling'] });
  const pdfW = doc.internal.pageSize.getWidth();
  const pdfH = doc.internal.pageSize.getHeight();

  const captureNext = (i) => {
    if (i >= pages.length) {
      wrap.remove();
      ov.remove();
      doc.save('تقرير-تقنية-المعلومات-يونيو-2026.pdf');
      return;
    }
    html2canvas(pages[i], {
      scale: 2,
      useCORS: true,
      allowTaint: true,
      backgroundColor: '#ffffff',
      width: 794,
      height: 1123,
      windowWidth: 794,
    }).then(canvas => {
      const imgData = canvas.toDataURL('image/jpeg', 0.92);
      if (i > 0) doc.addPage([794,1123], 'portrait');
      doc.addImage(imgData, 'JPEG', 0, 0, pdfW, pdfH);
      captureNext(i + 1);
    }).catch(err => {
      console.error('PDF export failed on page', i, err);
      wrap.remove();
      ov.remove();
      alert('حصل خطأ أثناء إنشاء التقرير، حاول مرة أخرى.');
    });
  };

  setTimeout(() => captureNext(0), 700);

  }); // end getLogoBase64
}

/* ══════════════════════════════════════════════════
   THEME TOGGLE
══════════════════════════════════════════════════ */
function toggleTheme() {
  const html   = document.documentElement;
  const isDark = html.getAttribute("data-theme") === "dark";
  html.setAttribute("data-theme", isDark ? "light" : "dark");

  const moon = document.getElementById('icon-moon');
  const sun  = document.getElementById('icon-sun');
  if (moon && sun) {
    moon.style.display = isDark ? 'block' : 'none';
    sun.style.display  = isDark ? 'none'  : 'block';
  }
  localStorage.setItem("theme", isDark ? "light" : "dark");
}

/* ══════════════════════════════════════════════════
   INIT
══════════════════════════════════════════════════ */
document.addEventListener('DOMContentLoaded', () => {
  /* Restore saved theme */
  const saved = localStorage.getItem("theme");
  if (saved === "dark") {
    document.documentElement.setAttribute("data-theme", "dark");
    const moon = document.getElementById('icon-moon');
    const sun  = document.getElementById('icon-sun');
    if (moon) moon.style.display = 'none';
    if (sun)  sun.style.display  = 'block';
  }

  /* Theme button */
  const btnTheme = document.getElementById('btn-theme');
  if (btnTheme) btnTheme.addEventListener('click', toggleTheme);

  /* Initial render */
  render('', '', '');
});
</script>
